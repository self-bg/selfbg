name: selfbg

# `docker compose pull && docker compose up -d`  -> use the published images.
# `docker compose up --build`                    -> build locally from source.
# Pin a version by setting SELFBG_TAG=v0.1.0 in .env; defaults to :latest.

services:
  api:
    image: ghcr.io/self-bg/selfbg-api:${SELFBG_TAG:-latest}
    build:
      context: ./backend
      args:
        SELFBG_MODEL: ${SELFBG_MODEL:-birefnet-general}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SELFBG_API_KEY: "${SELFBG_API_KEY:?SELFBG_API_KEY is required — generate one with: openssl rand -hex 32}"
      SELFBG_MODEL: ${SELFBG_MODEL:-birefnet-general}
      SELFBG_MAX_UPLOAD_MB: ${SELFBG_MAX_UPLOAD_MB:-25}
      SELFBG_CORS_ORIGINS: ${SELFBG_CORS_ORIGINS:-http://localhost:3000}
      SELFBG_REDIS_URL: ${SELFBG_REDIS_URL:-redis://redis:6379/0}
      SELFBG_RESULT_TTL_SECONDS: ${SELFBG_RESULT_TTL_SECONDS:-86400}
    ports:
      - "${API_BIND:-0.0.0.0:8000}:8000"
    volumes:
      - model-cache:/home/selfbg/.u2net
      - job-data:/data/jobs

  web:
    image: ghcr.io/self-bg/selfbg-web:${SELFBG_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SELFBG_API_ORIGIN: http://api:8000
    ports:
      - "${WEB_BIND:-0.0.0.0:3000}:3000"

  # Runs the same image as `api` but with `python -m app.worker` as the
  # entrypoint, so it warms the model and then blocks on the RQ queue.
  # Scale horizontally with `docker compose up -d --scale worker=N` once
  # the box has the RAM for it (each worker loads its own model copy).
  worker:
    image: ghcr.io/self-bg/selfbg-api:${SELFBG_TAG:-latest}
    build:
      context: ./backend
      args:
        SELFBG_MODEL: ${SELFBG_MODEL:-birefnet-general}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SELFBG_API_KEY: "${SELFBG_API_KEY:?SELFBG_API_KEY is required — generate one with: openssl rand -hex 32}"
      SELFBG_MODEL: ${SELFBG_MODEL:-birefnet-general}
      SELFBG_REDIS_URL: ${SELFBG_REDIS_URL:-redis://redis:6379/0}
      SELFBG_RESULT_TTL_SECONDS: ${SELFBG_RESULT_TTL_SECONDS:-86400}
    command: ["python", "-m", "app.worker"]
    volumes:
      - model-cache:/home/selfbg/.u2net
      - job-data:/data/jobs

  # Deletes old job folders from disk on a loop. Once Redis has expired
  # a job's record, this removes the input image and result PNG so the
  # data volume doesn't grow forever.
  cleaner:
    image: ghcr.io/self-bg/selfbg-api:${SELFBG_TAG:-latest}
    build:
      context: ./backend
      args:
        SELFBG_MODEL: ${SELFBG_MODEL:-birefnet-general}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SELFBG_API_KEY: "${SELFBG_API_KEY:?SELFBG_API_KEY is required — generate one with: openssl rand -hex 32}"
      SELFBG_MODEL: ${SELFBG_MODEL:-birefnet-general}
      SELFBG_REDIS_URL: ${SELFBG_REDIS_URL:-redis://redis:6379/0}
      SELFBG_RESULT_TTL_SECONDS: ${SELFBG_RESULT_TTL_SECONDS:-86400}
      SELFBG_CLEANUP_INTERVAL_SECONDS: ${SELFBG_CLEANUP_INTERVAL_SECONDS:-3600}
    command: ["python", "-m", "app.cleaner"]
    volumes:
      - job-data:/data/jobs

  # Job queue backend for async processing (batches, and later video).
  # Not exposed outside the compose network — only api and worker talk to it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  model-cache:
  redis-data:
  job-data:
